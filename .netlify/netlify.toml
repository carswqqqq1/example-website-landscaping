[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/img/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/manifest.json"

[headers.values]

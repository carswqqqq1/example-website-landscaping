name: Design pass screenshots (temporary)

# Temporary helper for the premium design pass PR. Takes before/after screenshots
# with Playwright's Chromium and commits them to docs/screenshots/design-pass.
# Removed again before the PR is ready for review.
on:
  push:
    branches: [claude/project-thread-r551in]
    paths-ignore:
      - 'docs/screenshots/design-pass/**'

permissions:
  contents: write

concurrency:
  group: design-pass-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.61.0
          npx playwright install --with-deps chromium
      - name: Check out the before state (master at c5441e3)
        run: git worktree add /tmp/before c5441e3
      - name: Take screenshots
        run: node scripts/design-pass-shots.js --before /tmp/before --after . --out docs/screenshots/design-pass
      - name: Run site checks
        run: npm run check:all
        continue-on-error: true
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/design-pass
          git commit -m "Design pass screenshots for $(git rev-parse --short HEAD)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

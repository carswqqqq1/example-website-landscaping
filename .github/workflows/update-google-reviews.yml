name: Update Google reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update-google-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Google reviews
        run: node scripts/update-google-reviews.js --allow-missing
        env:
          GOOGLE_REVIEW_FETCH_MODE: ${{ secrets.GOOGLE_REVIEW_FETCH_MODE }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          GOOGLE_PLACES_TEXT_QUERY: ${{ secrets.GOOGLE_PLACES_TEXT_QUERY }}
          GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID }}
          GOOGLE_BUSINESS_PROFILE_LOCATION_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_LOCATION_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      - name: Commit review feed update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Google review feed
          file_pattern: google-reviews.json
